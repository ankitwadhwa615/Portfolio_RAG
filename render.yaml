services:
  - type: web
    name: portfolio-rag-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://portfolio-b981b.web.app,https://portfolio-b981b.firebaseapp.com,http://localhost:3000,http://localhost:5000
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
